name: Fetch Gamma images
on:
  push:
    paths: ['.github/workflows/fetch-images.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download images
        run: |
          mkdir -p images
          for id in $(grep -o 'generated-images/[A-Z0-9]*\.jpg' index.html | sort -u | sed 's|generated-images/||; s|\.jpg||'); do
            curl -fsSL -A "Mozilla/5.0" -o "images/$id.jpg" "https://imgproxy.gamma.app/resize/quality:80/resizing_type:fit/width:1600/https://cdn.gamma.app/s3qv3m4kg2c2zc5/generated-images/$id.jpg" \
              || curl -fsSL -A "Mozilla/5.0" -o "images/$id.jpg" "https://cdn.gamma.app/s3qv3m4kg2c2zc5/generated-images/$id.jpg"
            file "images/$id.jpg"
          done
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add images
          git commit -m "Add self-hosted copies of Gamma images" || echo "nothing to commit"
          git push
